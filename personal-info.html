<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กรอกข้อมูลส่วนตัว - โปรแกรมการคัดกรองภาวะมวลกล้ามเนื้อน้อย SARC-F</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <div class="header-content">
            <img src="logo.jpg" alt="คณะพยาบาลศาสตร์ มหาวิทยาลัยหัวเฉียวเฉลิมพระเกียรติ" class="logo" onerror="this.style.display='none'">
            <span class="header-text">คณะพยาบาลศาสตร์ มหาวิทยาลัยหัวเฉียวเฉลิมพระเกียรติ</span>
        </div>
    </header>
    
    <div class="program-title-bar">
        <h1>โปรแกรมการคัดกรองความเสี่ยงภาวะมวลกล้ามเนื้อน้อย SARC-F</h1>
    </div>

    <nav class="breadcrumb">
        <a href="index.html">หน้าแรก</a>
        <span>/</span>
        <span class="active">กรอกข้อมูล</span>
    </nav>

    <main class="container">
        <div class="form-card">
            <h2>กรุณาป้อนข้อมูลเพื่อการแปลผล</h2>
            
            <form id="personalInfoForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstname">ชื่อ (Firstname)</label>
                        <input type="text" id="firstname" name="firstname" required>
                    </div>
                    <div class="form-group">
                        <label for="lastname">นามสกุล (Lastname)</label>
                        <input type="text" id="lastname" name="lastname" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label for="age">อายุ (ปี) : Age (years)</label>
                        <input type="number" id="age" name="age" min="1" max="120" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>เพศ</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="gender" value="ชาย" required>
                            <span>ชาย</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="หญิง">
                            <span>หญิง</span>
                        </label>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="height">ส่วนสูง (เซนติเมตร)</label>
                        <input type="number" id="height" name="height" min="50" max="250" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label for="weight">น้ำหนัก (กิโลกรัม)</label>
                        <input type="number" id="weight" name="weight" min="20" max="300" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label for="bmi">ดัชนีมวลกาย(BMI)</label>
                        <input type="text" id="bmi" name="bmi" readonly>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="diseases">โรคประจำตัว (คลิกเลือกได้หลายรายการ)</label>
                    <div class="custom-multi-select">
                        <div class="select-display" id="diseasesDisplay">เลือกโรคประจำตัว...</div>
                        <div class="select-options" id="diseasesOptions">
                            <label class="select-option">
                                <input type="checkbox" value="ไม่มี" data-disease>
                                <span>ไม่มี</span>
                            </label>
                            <label class="select-option">
                                <input type="checkbox" value="โรคความดันโลหิตสูง (HT)" data-disease>
                                <span>โรคความดันโลหิตสูง (HT)</span>
                            </label>
                            <label class="select-option">
                                <input type="checkbox" value="โรคไขมันในเลือดผิดปกติ (DLP)" data-disease>
                                <span>โรคไขมันในเลือดผิดปกติ (DLP)</span>
                            </label>
                            <label class="select-option">
                                <input type="checkbox" value="โรคปอดอุดกั้นเรื้อรัง (COPD)" data-disease>
                                <span>โรคปอดอุดกั้นเรื้อรัง (COPD)</span>
                            </label>
                            <label class="select-option">
                                <input type="checkbox" value="โรคไตเรื้อรัง (CKD)" data-disease>
                                <span>โรคไตเรื้อรัง (CKD)</span>
                            </label>
                            <label class="select-option">
                                <input type="checkbox" value="โรคมะเร็ง (CA)" data-disease>
                                <span>โรคมะเร็ง (CA)</span>
                            </label>
                            <label class="select-option">
                                <input type="checkbox" value="โรคตับแข็ง (Liver cirrhosis)" data-disease>
                                <span>โรคตับแข็ง (Liver cirrhosis)</span>
                            </label>
                            <label class="select-option">
                                <input type="checkbox" value="อื่นๆ" data-disease id="otherDiseaseCheck">
                                <span>อื่นๆ โปรดระบุ</span>
                            </label>
                        </div>
                    </div>
                    <input type="text" id="otherDiseaseText" name="otherDiseaseText" placeholder="ระบุโรคอื่นๆ" style="margin-top: 8px; display: none;">
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">ถัดไป</button>
                </div>
            </form>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
